[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vouchcode"
version = "0.1.0"
description = "Local-first cryptographic provenance and comprehension verification for AI-assisted development"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sudais Khalid", email = "msudaiskhalid.ai@gmail.com" }]
keywords = ["git", "provenance", "attribution", "ast", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]

# Runtime dependencies are deliberately minimal and contain no AI or network
# client of any kind. See CLAUDE.md Rule 4 and Section 3.1 of the research
# document (zero external model dependency).
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "GitPython>=3.1.43",
    "cryptography>=42.0",
    "reportlab>=4.1",
]

[project.optional-dependencies]
# The linter, formatter, and type checker are pinned exactly rather than floated.
# They are pass/fail gates in CI, and an unpinned gate makes a green build a function
# of upstream release dates instead of the diff under review: a new ruff release can
# reformat files a pull request never touched, and a new mypy release can report errors
# on unchanged code. Pinning keeps a local run and a CI run the same run. Bump these
# deliberately, in their own commit. pytest stays floated within a major version because
# it reports results rather than gating on style.
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
]

[project.scripts]
vouchcode = "vouchcode.cli:app"
# Registered as a Claude Code PostToolUse hook in a target repository. See
# vouchcode/adapters/claude_code_hook.py for the settings.json snippet.
vouchcode-claude-hook = "vouchcode.adapters.claude_code_hook:main"

[project.urls]
Repository = "https://github.com/sudais-khalid/vouchcode"

[tool.setuptools.packages.find]
where = ["."]
include = ["vouchcode*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_return_any = true
