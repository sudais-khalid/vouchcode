name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. Nothing in this workflow writes to the repository, and a
# workflow that cannot write cannot be turned into a supply chain foothold by a
# compromised dependency.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}, python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Run every combination even after one fails. A failure that reproduces on one
      # platform but not the other is the most informative signal this matrix produces,
      # and cancelling the siblings would hide it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows is not an afterthought for this project. The capture layer writes
          # hook scripts with forced LF line endings and an absolute interpreter path
          # specifically because git for Windows runs hooks through sh, and the
          # executable-bit logic branches on the platform. One Windows job keeps that
          # path honest.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Configure git identity
        # The test suite drives real git repositories rather than mocking git. A runner
        # has no global git identity, and the suite neutralizes global and system config
        # on purpose, so the per-command identity it sets is what commits actually use.
        # This step exists so that any git invocation outside that harness still works.
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        # A separate gate from lint. Formatting drift and lint violations are different
        # failures and reporting them separately says which one to fix.
        run: ruff format --check .

      - name: Type check
        run: mypy vouchcode

      - name: Test
        run: pytest -q

  audit:
    name: dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
          python -m pip install pip-audit

      - name: Audit dependencies
        # Reports known advisories against the installed dependency tree. A project whose
        # subject is supply chain provenance should know what it is shipping.
        #
        # Non-blocking on purpose. This step reports on the state of the advisory
        # databases, not on the diff under review, so a newly published advisory against
        # a transitive dependency would otherwise turn a pull request red for a reason
        # that has nothing to do with its changes. That is the same failure mode the
        # pinned tool versions in pyproject.toml exist to prevent. Findings are read and
        # acted on deliberately rather than by blocking the merge queue.
        continue-on-error: true
        run: pip-audit --strict --progress-spinner off
